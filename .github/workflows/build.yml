name: Build book website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static site
        run: npm run build
      - name: Verify output
        run: test -f dist/index.html && test -f dist/38LaThuRockefellerGuiChoConTrai.pdf
      - name: Verify server
        run: python3 -m py_compile server.py
