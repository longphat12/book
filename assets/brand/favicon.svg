<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143d2b" />
      <stop offset="100%" stop-color="#091f15" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Open Book Silhouette -->
  <!-- Left Page -->
  <path d="M13 18 C22 16, 29 19, 31 22 L31 46 C29 43, 22 41, 13 43 Z" fill="#ffffff" />
  <!-- Right Page -->
  <path d="M51 18 C42 16, 35 19, 33 22 L33 46 C35 43, 42 41, 51 43 Z" fill="#ffffff" />

  <!-- Active Yellow Highlight Capsule on right page -->
  <rect x="36" y="27" width="12" height="6" rx="2" fill="url(#favGold)" />
  <line x1="38" y1="30" x2="46" y2="30" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />

  <!-- Golden Bookmark Ribbon -->
  <path d="M32 14 L35.5 17.5 L35.5 32 L32 29 L28.5 32 L28.5 17.5 Z" fill="url(#favGold)" />

  <!-- Reading Focus Wave Underneath -->
  <path d="M14 50 C24 47, 40 47, 50 50" fill="none" stroke="url(#favGold)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="50" r="1.8" fill="#fef08a" />
</svg>
