<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="logoIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a1d" />
      <stop offset="50%" stop-color="#143d2b" />
      <stop offset="100%" stop-color="#091f15" />
    </linearGradient>

    <!-- Golden Highlight Gradient -->
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="logoGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- BRAND ICON (Left side) -->
  <g transform="translate(10, 10)">
    <!-- Icon Container -->
    <rect width="80" height="80" rx="20" fill="url(#logoIconGrad)" />
    <rect width="78" height="78" x="1" y="1" rx="19" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

    <!-- Open Book -->
    <!-- Left Page -->
    <path d="M18 24 C27 22, 35 25, 38 28 L38 58 C35 55, 27 53, 18 55 Z" fill="#ffffff" />
    <line x1="22" y1="32" x2="34" y2="30" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" />
    <line x1="22" y1="37" x2="34" y2="35" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" />
    <line x1="22" y1="42" x2="31" y2="41" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" />

    <!-- Right Page -->
    <path d="M62 24 C53 22, 45 25, 42 28 L42 58 C45 55, 53 53, 62 55 Z" fill="#ffffff" />
    <line x1="46" y1="30" x2="58" y2="32" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" />
    <!-- Yellow highlight on right page -->
    <rect x="45" y="35" width="13.5" height="5" rx="1.6" fill="url(#logoGold)" />
    <line x1="47" y1="37.5" x2="56" y2="37.5" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
    <line x1="46" y1="43" x2="56" y2="45" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" />

    <!-- Golden Bookmark Ribbon -->
    <path d="M40 19 L43 23 L43 40 L40 37 L37 40 L37 23 Z" fill="url(#logoGold)" filter="url(#logoGlow)" />

    <!-- Reading Wave Arc -->
    <path d="M18 64 C30 61, 50 61, 62 64" fill="none" stroke="url(#logoGold)" stroke-width="2" stroke-linecap="round" />
    <circle cx="62" cy="64" r="1.5" fill="#fef08a" />
  </g>

  <!-- LOGO TYPOGRAPHY & WORDMARK (Right side) -->
  <g transform="translate(106, 22)">
    <!-- Main Brand Name: Đọc Dễ -->
    <text x="0" y="34" font-family="'Manrope', 'Inter', system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8" fill="#143d2b">
      Đọc Dễ
    </text>

    <!-- Tagline: TRÌNH ĐỌC TẬP TRUNG -->
    <text x="1" y="52" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="2.4" fill="#475569">
      TRÌNH ĐỌC TẬP TRUNG
    </text>

    <!-- Focus Pill Capsule -->
    <g transform="translate(182, 14)">
      <rect width="84" height="22" rx="11" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2" />
      <circle cx="12" cy="11" r="3.5" fill="#f59e0b" />
      <text x="22" y="15" font-family="'DM Mono', monospace" font-size="10" font-weight="700" fill="#92400e" letter-spacing="0.5">
        FOCUS
      </text>
    </g>
  </g>
</svg>
